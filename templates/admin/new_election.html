{% extends 'admin/base_admin.html' %}
{% block title %}New Election{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-title">Create New Election</div>
    <div class="page-sub">Set up a new SRC election</div>
</div>

<div class="card" style="max-width:600px;">
    <form method="POST" action="{{ url_for('admin.new_election') }}">
        <div class="form-group">
            <label class="form-label">Election Title</label>
            <input type="text" class="form-control" name="title"
                   placeholder="e.g. 2026 SRC General Elections" required>
        </div>
        <div class="form-group">
            <label class="form-label">Description (optional)</label>
            <textarea class="form-control" name="description"
                      placeholder="Brief description of this election"></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">Start Date & Time</label>
            <input type="datetime-local" class="form-control" name="start_time" required>
        </div>
        <div class="form-group">
            <label class="form-label">End Date & Time</label>
            <input type="datetime-local" class="form-control" name="end_time" required>
        </div>
        <div style="display:flex;gap:0.75rem;">
            <button type="submit" class="btn btn-primary">Create Election</button>
            <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
