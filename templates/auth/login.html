{% extends 'base.html' %}
{% block title %}Login — UB eBallot{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo"><span>UB</span> eBallot</div>
            <div class="auth-title">Voter Login</div>
            <div class="auth-subtitle">Sign in with your UB student credentials</div>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label class="form-label" for="student_number">Student Number</label>
                <input type="text" class="form-control" id="student_number" name="student_number"
                       placeholder="e.g. 202203607" required autocomplete="username"
                       value="{{ request.form.get('student_number', '') }}">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Your password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Login</button>
        </form>

        <div class="auth-footer-link">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
