# ─────────────────────────────────────────────────────────────────────────────
# nginx reverse-proxy config for UB eBallot
#
# Prerequisites on your Linux server:
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.ub.ac.bw
#
# Copy this file to /etc/nginx/sites-available/ubeballot
# then: sudo ln -s /etc/nginx/sites-available/ubeballot /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN with your actual domain name throughout this file.
# ─────────────────────────────────────────────────────────────────────────────

# Redirect all plain HTTP to HTTPS
server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # ── SSL (managed by Certbot — do not hand-edit these paths) ──────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers (nginx layer — Flask also sets these) ────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Request limits ────────────────────────────────────────────────────────
    client_max_body_size 10M;      # matches Flask's 10 MB upload limit
    client_body_timeout  30s;
    client_header_timeout 30s;

    # ── Static files served directly by nginx (faster than Flask) ────────────
    location /static/ {
        alias /path/to/ub_eballot/static/;   # <-- update this path
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Proxy everything else to Gunicorn ─────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;   # Gunicorn binds here
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Don't buffer slow uploads (CSV registry imports)
        proxy_request_buffering off;
    }
}
