{% extends "base.html" %}

{% block title %}413 - Payload Too Large{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-info">
                <div class="card-header bg-info text-white">
                    <h4 class="mb-0"><i class="fas fa-weight-hanging"></i> File Too Large</h4>
                </div>
                <div class="card-body text-center">
                    <h1 class="display-1 text-info">413</h1>
                    <h3 class="card-title">Payload Too Large</h3>
                    <p class="card-text">
                        The file or data you tried to upload is too large.
                        Please reduce the file size and try again.
                    </p>
                    <p class="text-muted">
                        Maximum allowed size: 10 MB
                    </p>
                    <div class="mt-4">
                        <a href="javascript:history.back()" class="btn btn-info">
                            <i class="fas fa-arrow-left"></i> Go Back
                        </a>
                        <a href="{{ url_for('main.index') }}" class="btn btn-secondary">
                            <i class="fas fa-home"></i> Go Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
