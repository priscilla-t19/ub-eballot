{% extends 'admin/base_admin.html' %}
{% block title %}Change Password{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-title">Change Admin Password</div>
    <div class="page-sub">Use a strong password before production deployment.</div>
</div>

<div class="card" style="max-width: 720px;">
    <form method="POST" action="{{ url_for('admin.change_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="form-group">
            <label class="form-label" for="current_password">Current password</label>
            <input id="current_password" type="password" class="form-control" name="current_password" required autocomplete="current-password">
        </div>

        <div class="form-group">
            <label class="form-label" for="new_password">New password</label>
            <input id="new_password" type="password" class="form-control" name="new_password" required autocomplete="new-password">
            <div class="form-help small text-muted">Use at least 12 characters with uppercase, lowercase, numbers, and symbols.</div>
        </div>

        <div class="form-group">
            <label class="form-label" for="confirm_password">Confirm new password</label>
            <input id="confirm_password" type="password" class="form-control" name="confirm_password" required autocomplete="new-password">
        </div>

        <div style="display:flex;gap:0.75rem;flex-wrap:wrap;">
            <button type="submit" class="btn btn-primary">Update Password</button>
            <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
